<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>
    <div id="gameWindow">
        <div id="aiDisplay" style="position: absolute; top: 15px; left: 15px; color: #fff; font-size: 16px; z-index: 100; pointer-events: none; display: none;">
            AI - F:<span id="aiF">0</span> B:<span id="aiB">0</span> C:<span id="aiC">0</span> Fx:<span id="aiFx">0</span> G:<span id="aiG">0</span>
        </div>

        <div id="office">
            <div id="leftDoor" class="door"></div>
            <div id="rightDoor" class="door"></div>
            
            <div id="leftButtons" class="button-panel">
                <button id="toggleLeft" type="button" class="panel-button"></button>
            </div>
            <div id="rightButtons" class="button-panel">
                <button id="toggleRight" type="button" class="panel-button"></button>
            </div>

            <!-- Lives inside #office so it pans with the room and disappears with
                 it on the menu. #cameraOverlay sits outside at z-index 50, so
                 raising the monitor still covers him. -->
            <img id="goldenFreddy" src="textures/office/misc/golden freddy sprite.png" alt="" style="display:none;">
        </div>

        <div id="cameraContainer">
            <div id="cameraDropdown"></div>
        </div>

        <div id="cameraOverlay" style="display:none;">
            <img id="cameraFeed" src="" alt="Camera Feed" style="display:none;">
            <img id="cameraStatic" src="textures/static/12.png" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; z-index: 5; opacity: 0.25;">
            <img id="camGlitch" src="" alt="" style="display:none;">
            <img id="kitchenText" class="text-plate" src="textures/camera/cam assets/kitchen txt.png" alt="Camera disabled - audio only">
            <img id="camBorder" src="textures/camera/cam assets/cam border.png" alt="Cam Border">
            <div class="red-dot"></div>

            <!-- Marker left/top are room centres on the 400x400 map plate; the
                 markers are centred on them via translate(-50%, -50%). -->
            <div class="camera-map">
                <img id="camNameImg" class="text-plate" src="textures/camera/camera names/1A.png" alt="Camera Name">
                <img id="camMapBg" src="textures/camera/cam assets/cam map.png" alt="Cam Map">

                <div class="camera-position active" data-cam="1A" style="left:44.5%; top:15%;">
                    <img class="text-plate" src="textures/camera/cam assets/1a.png" alt="1A">
                </div>
                <div class="camera-position" data-cam="1B" style="left:44.6%; top:36.5%;">
                    <img class="text-plate" src="textures/camera/cam assets/1b.png" alt="1B">
                </div>
                <div class="camera-position" data-cam="1C" style="left:10.4%; top:46.3%;">
                    <img class="text-plate" src="textures/camera/cam assets/1c.png" alt="1C">
                </div>
                <div class="camera-position" data-cam="2A" style="left:31.4%; top:66%;">
                    <img class="text-plate" src="textures/camera/cam assets/2a.png" alt="2A">
                </div>
                <div class="camera-position" data-cam="2B" style="left:31.4%; top:84%;">
                    <img class="text-plate" src="textures/camera/cam assets/2b.png" alt="2B">
                </div>
                <div class="camera-position" data-cam="3" style="left:18.5%; top:68.8%;">
                    <img class="text-plate" src="textures/camera/cam assets/3.png" alt="3">
                </div>
                <div class="camera-position" data-cam="4A" style="left:57.5%; top:66%;">
                    <img class="text-plate" src="textures/camera/cam assets/4a.png" alt="4A">
                </div>
                <div class="camera-position" data-cam="4B" style="left:57.5%; top:84%;">
                    <img class="text-plate" src="textures/camera/cam assets/4b.png" alt="4B">
                </div>
                <div class="camera-position" data-cam="5" style="left:7.1%; top:27.9%;">
                    <img class="text-plate" src="textures/camera/cam assets/5.png" alt="5">
                </div>
                <div class="camera-position" data-cam="6" style="left:77.2%; top:65.8%;">
                    <img class="text-plate" src="textures/camera/cam assets/6.png" alt="6">
                </div>
                <div class="camera-position" data-cam="7" style="left:81%; top:39.3%;">
                    <img class="text-plate" src="textures/camera/cam assets/7.png" alt="7">
                </div>
            </div>
        </div>

        <!-- Sits in the frame rather than in #office or #cameraOverlay, so it holds
             the same spot beside the red dot whichever of the two is on screen. -->
        <img id="muteCall" src="textures/office/misc/mute call.png" alt="Mute call" style="display:none;">

        <div id="newStartScreen" style="display:none;">
            <img id="newStartImg" src="textures/main menu/new start.png" alt="Help Wanted - New Start">
        </div>

        <div id="nightIntroScreen" style="display:none;">
            <img id="nightIntroImg" class="text-plate" src="" alt="12 AM Night">
            <img id="nightIntroGlitch" src="" alt="" style="display:none;">
        </div>

        <img id="cameraAnimation" src="" alt="Camera Animation" style="display:none;">

        <img id="jumpscare" src="textures/jumpscares/freddy/489.png" alt="Jumpscare" style="display:none;">

        <!-- The inline display flags are load-bearing: script.js gates behaviour on
             `el.style.display`, so these must stay inline, not move into the CSS. -->
        <div id="deathStaticScreen" style="display:none;">
            <img id="deathStaticImg" src="textures/static/12.png" alt="">
        </div>

        <div id="gameOverScreen" style="display:none;">
            <img id="gameOverImg" src="textures/main menu/gameover.png" alt="Game Over">
            <img id="gameOverTxt" class="text-plate" src="textures/main menu/gameovertxt.png" alt="">
        </div>

        <div id="winScreen" style="display:none;">
            <div id="winDigitContainer">
                <img id="winDigit5" class="text-plate" src="textures/win/350.png" alt="5">
                <img id="winDigit6" class="text-plate" src="textures/win/351.png" alt="6">
            </div>
            <img id="winAmText" class="text-plate" src="textures/win/352.png" alt="AM">
        </div>

        <!-- Paycheck / termination card shown after nights 5, 6 and 7. -->
        <div id="endCardScreen" style="display:none;">
            <img id="endCardImg" src="" alt="Night complete">
        </div>

        <!-- HUD readouts are drawn as 1-bit pixel text so they match the blocky
             plates (see drawPixelText in script.js), not as smooth live text. -->
        <div id="powerUsage">
            <canvas id="powerDisplay" class="pixel-text"></canvas>
            <div class="usage-container">
                <canvas id="usageLabel" class="pixel-text"></canvas>
                <img id="powerUsageImg" src="textures/power/1 usage.png" alt="Power Usage">
                <div id="usageDisplay" style="display: none;">1</div>
            </div>
        </div>

        <div id="timeDisplayContainer">
            <canvas id="timeDisplay" class="pixel-text"></canvas>
            <canvas id="nightDisplay" class="pixel-text"></canvas>
        </div>

        <div id="mainMenu" style="display:none;">
            <img id="menuBg" src="textures/main menu/431.png" alt="Menu Background">
            <img id="menuStatic" src="textures/static/12.png" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; z-index: 2; opacity: 0.15;">
            <img id="menuTitle" class="text-plate" src="textures/main menu/name.png" alt="Five Nights at Freddy's">
            <div id="starsContainer"></div>

            <img id="selectorArrow" class="text-plate" src="textures/main menu/hover.png" alt=">>">

            <!-- Labels are the game's own Consolas plates rather than live text. -->
            <div class="menu-buttons">
                <div id="btnNewGame" class="menu-item">
                    <img class="text-plate" src="textures/main menu/448.png" alt="New Game">
                </div>
                <div id="btnContinue" class="menu-item">
                    <img class="text-plate" src="textures/main menu/449.png" alt="Continue">
                    <div id="continueSubhead" class="menu-subhead">
                        <img class="text-plate" src="textures/main menu/night sub.png" alt="Night">
                        <span id="continueNight">1</span>
                    </div>
                </div>
                <!-- Hidden with `visibility` rather than `display` so the slot is
                     held and Custom Night stays put whether or not it's unlocked. -->
                <div id="btnNight6" class="menu-item" style="visibility: hidden;">
                    <img class="text-plate" src="textures/main menu/6th night menu.png" alt="6th Night">
                </div>
                <div id="btnCustomNight" class="menu-item" style="display: none;">
                    <img class="text-plate" src="textures/main menu/custom night menu.png" alt="Custom Night">
                </div>
            </div>

            <div id="creditText">Web recreation by Luiz Lee</div>
            <div id="copyrightText">&copy;2014 Scott Cawthon</div>
        </div>

        <div id="customNightScreen" style="display:none;">
            <div class="custom-header">
                <img src="textures/customnight/ai level.png" alt="A.I. LEVEL" class="custom-title-img text-plate">
            </div>
            <div class="custom-animatronics">
                <div class="anim-card">
                    <img src="textures/customnight/freddy.icon.png" alt="Freddy" class="anim-icon">
                    <img src="textures/customnight/freddy.name.png" alt="Freddy" class="anim-name text-plate">
                    <div class="ai-controls">
                        <button class="ai-btn" id="freddyMinus">&lt;</button>
                        <span class="ai-val" id="customAiFreddy">20</span>
                        <button class="ai-btn" id="freddyPlus">&gt;</button>
                    </div>
                </div>
                <div class="anim-card">
                    <img src="textures/customnight/bonnie.icon.png" alt="Bonnie" class="anim-icon">
                    <img src="textures/customnight/bonnie.name.png" alt="Bonnie" class="anim-name text-plate">
                    <div class="ai-controls">
                        <button class="ai-btn" id="bonnieMinus">&lt;</button>
                        <span class="ai-val" id="customAiBonnie">20</span>
                        <button class="ai-btn" id="bonniePlus">&gt;</button>
                    </div>
                </div>
                <div class="anim-card">
                    <img src="textures/customnight/chica.icon.png" alt="Chica" class="anim-icon">
                    <img src="textures/customnight/chica.name.png" alt="Chica" class="anim-name text-plate">
                    <div class="ai-controls">
                        <button class="ai-btn" id="chicaMinus">&lt;</button>
                        <span class="ai-val" id="customAiChica">20</span>
                        <button class="ai-btn" id="chicaPlus">&gt;</button>
                    </div>
                </div>
                <div class="anim-card">
                    <img src="textures/customnight/foxy.icon.png" alt="Foxy" class="anim-icon">
                    <img src="textures/customnight/foxy.name.png" alt="Foxy" class="anim-name text-plate">
                    <div class="ai-controls">
                        <button class="ai-btn" id="foxyMinus">&lt;</button>
                        <span class="ai-val" id="customAiFoxy">20</span>
                        <button class="ai-btn" id="foxyPlus">&gt;</button>
                    </div>
                </div>
            </div>
            <img src="textures/customnight/level.png" alt="(0-2)easy (3-6)med (7-12)hard (13-20)extreme" class="custom-legend text-plate">

            <div class="custom-actions">
                <img id="btnStartCustom" src="textures/customnight/ready.png" alt="READY" class="btn-ready-img text-plate">
                <div id="btnBackCustom" class="custom-back-btn">BACK</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="client.js?v=2"></script>
    <script src="script.js?v=3"></script>
</body>

</html>
