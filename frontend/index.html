<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNAF Web Clone</title>
    <link rel="stylesheet" href="style.css?v=1">
</head>

<body>
    <div id="gameWindow">
        <div id="aiDisplay" style="position: absolute; top: 15px; left: 15px; color: #fff; font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; z-index: 100; text-shadow: 0 0 5px #000; pointer-events: none; display: none;">
            AI - F:<span id="aiF">0</span> B:<span id="aiB">0</span> C:<span id="aiC">0</span> Fx:<span id="aiFx">0</span>
        </div>

        <div id="office">
            <div id="leftDoor" class="door"></div>
            <div id="rightDoor" class="door"></div>
            
            <div id="leftButtons" class="button-panel">
                <button id="toggleLeft" type="button" class="panel-button"></button>
            </div>
            <div id="rightButtons" class="button-panel">
                <button id="toggleRight" type="button" class="panel-button"></button>
            </div>
        </div>

        <div id="cameraContainer">
            <div id="cameraDropdown"></div>
        </div>

        <div id="cameraOverlay" style="display:none;">
            <img id="cameraFeed" src="" alt="Camera Feed" style="display:none;">
            <div class="red-dot"></div>
            <div class="camera-map">
                <img id="camMapBg" src="textures/camera/cam assets/cam map.png" alt="Cam Map">
                <img id="onClickBorder" class="on-click-border" src="textures/camera/cam assets/on click map border.png" alt="Selected">
                
                <div class="camera-position" data-cam="1A" style="left:46%; top:6%;">
                    <img src="textures/camera/cam assets/1a.png" alt="1A">
                </div>
                <div class="camera-position" data-cam="1B" style="left:42%; top:22%;">
                    <img src="textures/camera/cam assets/1b.png" alt="1B">
                </div>
                <div class="camera-position" data-cam="1C" style="left:28%; top:39%;">
                    <img src="textures/camera/cam assets/1c.png" alt="1C">
                </div>
                <div class="camera-position" data-cam="2A" style="left:33%; top:62%;">
                    <img src="textures/camera/cam assets/2a.png" alt="2A">
                </div>
                <div class="camera-position" data-cam="2B" style="left:33%; top:79%;">
                    <img src="textures/camera/cam assets/2b.png" alt="2B">
                </div>
                <div class="camera-position" data-cam="3" style="left:16%; top:60%;">
                    <img src="textures/camera/cam assets/3.png" alt="3">
                </div>
                <div class="camera-position" data-cam="4A" style="left:57%; top:62%;">
                    <img src="textures/camera/cam assets/4a.png" alt="4A">
                </div>
                <div class="camera-position" data-cam="4B" style="left:57%; top:79%;">
                    <img src="textures/camera/cam assets/4b.png" alt="4B">
                </div>
                <div class="camera-position" data-cam="5" style="left:10%; top:26%;">
                    <img src="textures/camera/cam assets/5.png" alt="5">
                </div>
                <div class="camera-position" data-cam="6" style="left:76%; top:52%;">
                    <img src="textures/camera/cam assets/6.png" alt="6">
                </div>
                <div class="camera-position" data-cam="7" style="left:80%; top:26%;">
                    <img src="textures/camera/cam assets/7.png" alt="7">
                </div>
            </div>
        </div>

        <img id="cameraAnimation" src="" alt="Camera Animation" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; object-fit:contain; background:rgba(0,0,0,0.9); z-index:200;">

        <img id="jumpscare" src="textures/jumpscares/freddy/489.png" alt="Jumpscare" style="display:none;">

        <div id="powerUsage">
            <div class="hud-text" style="margin-bottom: 5px;">Power left: <span id="powerDisplay">100%</span></div>
            <div class="hud-text usage-container">
                Usage: <img id="powerUsageImg" src="textures/power/1 usage.png" alt="Power Usage">
                <div id="usageDisplay" style="display: none;">1</div>
            </div>
        </div>

        <div id="timeDisplayContainer">
            <div id="timeDisplay" class="hud-text" style="font-size: 32px; text-align: right; margin-bottom: 5px;">12 AM</div>
            <div id="nightDisplay" class="hud-text" style="font-size: 20px; text-align: right;">Night 1</div>
        </div>

        <div id="mainMenu" style="display:none;">
            <img id="menuBg" src="textures/main menu/431.png" alt="Menu Background">
            <img id="menuTitle" src="textures/main menu/name.png" alt="FNAF">
            <div class="menu-buttons">
                <button id="btnNewGame" class="menu-btn">New Game</button>
                <button id="btnNight1" class="menu-btn">Night 1</button>
                <button id="btnNight2" class="menu-btn">Night 2</button>
                <button id="btnNight3" class="menu-btn">Night 3</button>
                <button id="btnNight4" class="menu-btn">Night 4</button>
                <button id="btnNight5" class="menu-btn">Night 5</button>
                <button id="btnNight6" class="menu-btn">Night 6</button>
                <button id="btnNight7" class="menu-btn">Night 7</button>
                <button id="btnCustomNight" class="menu-btn">Custom Night</button>
            </div>
            <div id="versionText">v 1.13</div>
            <div id="copyrightText">©2014 Scott Cawthon</div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="client.js?v=1"></script>
    <script src="script.js?v=1"></script>
</body>

</html>
